# Settings-of-record for the main Pythia-160M W_U trajectory crosscoder.
# Field names mirror the scripts/train/train_crosscoder.py CLI flags.
# Documentation/record only; not auto-loaded. See configs/README.md.
name: pythia-160m_wu_d24576_seed0
model: EleutherAI/pythia-160m
matrix: W_U

# Dictionary geometry
d_sae: 24576              # expansion_factor 32.0 at d_model=768 (24576 / 768)
expansion_factor: 32.0
n_snapshots: 32           # cross-snapshot-32 (readout.core.model_specs.DEFAULT_STEPS_32)

# Optimizer / schedule (shared Pythia W_U recipe; "Run 3")
batch_size: 1024
lr: 5.0e-5
n_epochs: 300
seed: 0
input_preprocess: center_scale
amp_dtype: fp32

# JumpReLU dictionary hyperparameters
l1_coefficient: 0.3       # 'lambda' column in full_inventory.csv
tanh_stretch: 1.0
init_threshold: 0.1

# Reported instrument quality (full_inventory.csv, for cross-checking a retrain)
reported:
  EV: 0.9196
  mean_L0: 286.4
  dead_rate: 0.0
  n_params: 1208795136

source: >
  Makefile train example + scripts/train/train_crosscoder.py docstring
  (batch_size/lr/n_epochs/seed/input_preprocess/amp_dtype);
  experiments/crosscoders/crosscoder_main/derived/appendix_validation/full_inventory.csv
  (d_sae=24576, lambda=0.3, tanh_stretch=1.0, init_threshold=0.1, epochs=300 row);
  experiments.yaml: crosscoder_main inputs (pythia-160m W_U cross-snapshot-32 d24576 seed0).
