# Settings-of-record for the W_E (input embedding) companion crosscoder on
# Pythia-160M (read-write asymmetry appendix). Multi-seed pilot (seeds 0-4);
# this config records the seed-0 point. Field names mirror the
# scripts/train/train_crosscoder.py CLI flags.
# Documentation/record only; not auto-loaded. See configs/README.md.
name: pythia-160m_we_d8192_seed0
model: EleutherAI/pythia-160m
matrix: W_E

# Dictionary geometry
d_sae: 8192               # expansion_factor 10.6667 at d_model=768 (8192 / 768)
expansion_factor: 10.6667
n_snapshots: 32           # cross-snapshot-32 (readout.core.model_specs.DEFAULT_STEPS_32)
seeds_trained: [0, 1, 2, 3, 4]   # multi-seed pilot; this file records seed 0

# Optimizer / schedule (shared Pythia recipe)
lr: 5.0e-5                # from the released-checkpoint .config.json sidecar (matches shared recipe)
batch_size: 1024
n_epochs: 300
seed: 0
input_preprocess: center_scale
amp_dtype: fp32

# JumpReLU dictionary hyperparameters
l1_coefficient: 0.3       # 'lambda' column in full_inventory.csv
tanh_stretch: 4.0         # NB: W_E uses tanh_stretch 4.0 (W_U uses 1.0)
init_threshold: 0.1

# Reported instrument quality (full_inventory.csv W_E d8192 seed0 row)
reported:
  EV: 0.5813
  mean_L0: 82.3
  dead_rate: 0.0
  n_params: 402948096

# A wider d24576 W_E variant (EV 0.8309, L0 117.7) also exists in
# full_inventory.csv if needed.
source: >
  released-checkpoint .config.json sidecar (pythia-160m W_E d8192 seed0: lr=5e-5);
  experiments/crosscoders/crosscoder_main/derived/appendix_validation/full_inventory.csv
  (pythia-160m W_E cross-snap-32 d8192 seeds 0-4: lambda=0.3, tanh_stretch=4.0,
  init_threshold=0.1, epochs=300);
  experiments.yaml: crosscoder_we (pythia-* W_E cross-snapshot-32 multi-seed);
  scripts/train/train_crosscoder.py docstring (shared Pythia recipe:
  input_preprocess=center_scale, amp_dtype=fp32).
