[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "learning-to-read-out"
version = "0.1.0"
description = "Sparse readout formation in language model pretraining: parameter-trajectory crosscoders on the unembedding matrix"
readme = "README.md"
license = "MIT"
authors = [{ name = "Matteo He", email = "mh2274@cam.ac.uk" }]
requires-python = ">=3.11,<3.13"
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Intended Audience :: Science/Research",
]
dependencies = [
    "torch>=2.5,<3",
    "transformers>=5.0,<6",
    "numpy>=1.26,<3",
    "tqdm>=4.66,<5",
    "scipy>=1.15.3,<2",
    "pandas>=2.2,<3",
    "scikit-learn>=1.5,<2",
    "datasets>=4.8.4,<5",
    "einops>=0.8,<1",
    "llamascopium",
    "safetensors>=0.4,<1",
    "requests>=2,<3",
    "huggingface-hub>=0.30,<2",
    "nltk>=3.8,<4",
    "pyyaml>=6,<7",
]

[tool.hatch.build.targets.wheel]
# The import package is `readout` (src layout); the distribution keeps the repo name.
packages = ["src/readout"]

[tool.uv.sources]
# Pin Linux torch build to CUDA 11.8 wheels: cu118 is forward-compatible with
# older GPU-node drivers that the cu124/cu130 wheels uv otherwise picks are
# not. Mac falls through to PyPI. Swap the index if your nodes support newer CUDA.
torch = [
    { index = "pytorch-cu118", marker = "sys_platform == 'linux'" },
]
# THIRD-PARTY: OpenMOSS Language-Model-SAEs / llamascopium (MIT, (c) 2024
# OpenMOSS), vendored under lib/ and built from source. The thesis uses its
# Crosscoder/CrosscoderConfig model and SparseAdam optimizer for the production
# W_U dictionaries (src/readout/crosscoder/wu_adapter.py). The vendored copy carries one
# local patch — a DTensor-safe init_encoder_with_decoder_transpose that avoids a
# deadlock during 4-GPU head-parallel training — so the published PyPI wheel
# (2.0.0b34) is not a drop-in substitute. See docs/THIRD_PARTY.md.
llamascopium = { path = "lib/Language-Model-SAEs", editable = true }

[[tool.uv.index]]
name = "pytorch-cu118"
url = "https://download.pytorch.org/whl/cu118"
explicit = true

[project.optional-dependencies]
dev = [
    "pytest",
    "ruff",
]

[tool.ruff]
line-length = 120
extend-exclude = ["lib"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.ruff.lint.isort]
# experiments/ is a namespace package (no __init__.py); pin it (and readout) as
# first-party so import sorting doesn't depend on package-marker files.
known-first-party = ["readout", "experiments"]

[tool.ruff.lint.per-file-ignores]
# A few experiment scripts set module-level constants or same-dir sys.path
# entries (sibling-module imports) before library imports; the example sets
# warning filters first.
"experiments/**" = ["E402"]
"scripts/**" = ["E402"]
"examples/**" = ["E402"]
# Colab notebooks interleave %pip bootstrap cells with imports by design.
"notebooks/*.ipynb" = ["E402"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = [
    # Vendored llamascopium decorates unused model classes with
    # @torch.autocast(device_type="cuda") at import time; harmless on CPU.
    "ignore:CUDA is not available:UserWarning",
]
