# Machine-readable experiment manifest. Single source of truth for:
#   - which experiment dir produces which paper figure
#   - canonical input/output paths
#   - the paper-figure labels each experiment's metrics back
#
# Maintained / checked by:
#   uv run python scripts/audit/check_layout.py    # validates schema + paper-label coverage
#
# Schema (per entry):
#   id:               str   matches experiments/<topic>/<id>/ and figures/<id>/; results_dir is
#                     usually results/experiments/<topic>/<id>/, but four entries drop the
#                     <topic> segment to match their scripts' historical defaults
#   status:           one of {active, draft, superseded, archived}
#   description:      one sentence — what this experiment investigates
#   paper_intent:     what part of the paper claim this supports (semantic, not section number;
#                     "Section 5.x" tags are descriptive only, sections may renumber)
#   scripts_dir:      where the runnable code lives; always the experiment's
#                     scripts/ dir (experiments/<topic>/<id>/scripts/, audit-enforced)
#   figures_dir:      where figure outputs are written
#   results_dir:      where numerical outputs are written (gitignored)
#   NB: when an experiment runs, its metrics land under experiments/<topic>/<id>/derived/
#       (gitignored, NOT shipped); results_dir is the external-SSD recomputation path.
#   inputs:           canonical input paths (usually SSD)
#   paper_labels:     list of \label{fig:...} or \label{tab:...} strings this experiment produces
#   paper_figures:    list of "<path-relative-to-paper/main.tex \graphicspath> -> <label>" mappings
#   entry:            primary CLI command(s) in execution order (optional)
#   cited_in:         which prose files reference these figures. Convention: every
#                     experiment carrying a fig:main-* label lists paper/main.tex;
#                     [] means no shipped prose file cites the experiment's figures
#
# ─── CODE-ONLY RELEASE ───────────────────────────────────────────────────────
# This repository ships code only — no data and no metrics. Each experiment
# computes and PERSISTS the metrics behind its figures (CSV/JSON/.pt) when run —
# those regenerated files are the reproducible artifacts (gitignored, not
# shipped) — and ships NO figure-rendering code. The `paper_labels:` and
# `paper_figures:` fields below are documentational: they map each experiment's
# metrics to the paper figures they back, which are rendered in the separate
# paper LaTeX tree, not in this repo.

# Top-level paper_only_labels are labels owned by the paper itself, not produced
# by an experiment pipeline.
paper_only_labels:
  - fig:overview                          # Figure 1 (TikZ); its two margins are per-example outputs of contrastive_readout_swap
  - fig:method-cross-snapshot-schematic   # method schematic (TikZ, hand-drawn)
  # Hand-authored paper tables (typeset in the LaTeX tree, no experiment pipeline produces them):
  - tab:task-protocol                # Table 1: task protocol; localization counts from readout.probes.contrastive_tasks
  - tab:method-comparison            # Table 2: qualitative method comparison
  - tab:evaluation-controls          # method appendix: evaluation controls
  - tab:compute-resources            # reproducibility appendix: compute envelope
  - tab:lifecycle-profile-rules      # lifecycle appendix: rule-based profile definitions
  - tab:app-terminology-glossary     # scope appendix: glossary
  - tab:app-task-construction        # availability appendix: prompt templates and word lists

# Naming principle: experiment ids describe the experiment object, not its paper position.
#   GOOD: feature_lifecycle_trajectories, temporal_localization_patching
#   BAD : section52, sec_5_3, fig1_experiment

experiments:

  # ─── Core paper claims (Results) ────────────────────────────────────────────

  - id: crosscoder_main
    status: active
    description: |
      Multiscale main analysis (160M / 1B / 6.9B trajectory crosscoders).
      Umbrella experiment for the shared multiscale analyses. The lifecycle,
      temporal-localization, EV/L0-pareto, and per-snapshot baseline analyses each
      live in their own claim-anchored experiment; this entry holds the rest.
    paper_intent: |
      Dictionary quality across Pythia-160M, 1B, 6.9B (Figure D.1) and the instrument
      validation in Appendix D: functional fidelity, PCA baselines, the dictionary
      inventory, and the dictionary hyperparameters.
    scripts_dir: experiments/crosscoders/crosscoder_main/scripts/
    figures_dir: figures/crosscoder_main/
    results_dir: results/experiments/crosscoders/crosscoder_main/
    inputs:
      - ${UM_SSD_ROOT}/hf_release/parameter-trajectory-crosscoders/pythia-160m/W_U/cross-snapshot-32/d24576/seed0.safetensors
      - ${UM_SSD_ROOT}/hf_release/parameter-trajectory-crosscoders/pythia-1b/W_U/cross-snapshot-32/d24576/seed0.safetensors
      - ${UM_SSD_ROOT}/hf_release/parameter-trajectory-crosscoders/pythia-6.9b/W_U/cross-snapshot-32/d32768/seed0-sparse.safetensors
      - ${UM_SSD_ROOT}/hf_release/parameter-trajectory-crosscoders/pythia-6.9b/W_U/cross-snapshot-32/d32768/seed0.safetensors  # denser/default-lambda comparison only
      - ${UM_SSD_ROOT}/snapshots/pythia-1b/EleutherAI_pythia-1b_step*_wu.pt
      - ${UM_SSD_ROOT}/derived/aggregates/aggregates_pythia-*_d*_seed*.pt
      - ${UM_SSD_ROOT}/derived/readout_edit_timing*/hLN_step*.pt  # h_LN caches for the functional-fidelity evaluation
      - ${UM_SSD_ROOT}/hf_release/parameter-trajectory-crosscoders/evaluation/eval-corpus/eval_tokens.pt
    paper_labels:
      # NB: labels for the split-out lifecycle / temporal / pareto / persnap experiments
      # now live on those experiments (feature_lifecycle_trajectories,
      # temporal_localization_patching, pareto_frontier_ev_l0, persnap_sae_baseline).
      - fig:main-multimodel-validation
      - fig:app-fidelity-curves
      - fig:app-pca-static
      - fig:app-concat-pca
      - tab:repro-dictionary-hparams
      - tab:full-inventory
    paper_figures:
      - "paper/figures/multimodel_validation/instrument_validation_summary.pdf -> fig:main-multimodel-validation"
      - "paper/figures/readout_functional_fidelity/fidelity_curves.pdf -> fig:app-fidelity-curves"  # readout_functional_fidelity.py (matrix EV, logit R2, KL, dNLL, top-1/5); strata prose from readout_functional_fidelity_strata.py
      - "paper/figures/dense_baselines/static_pca_baseline.pdf -> fig:app-pca-static"
      - "paper/figures/dense_baselines/concatenated_trajectory_pca.pdf -> fig:app-concat-pca"
      - "experiments/crosscoders/crosscoder_main/derived/appendix_validation/full_inventory.csv -> tab:full-inventory"
    cited_in:
      - paper/main.tex
    entry:
      - "uv run python experiments/crosscoders/crosscoder_main/scripts/appendix_validation/readout_functional_fidelity.py --model pythia-160m --d-sae 8192 --seed 0 --steps all --hln-dir ${UM_SSD_ROOT}/derived/readout_edit_timing"
      - "uv run python experiments/crosscoders/crosscoder_main/scripts/appendix_validation/readout_functional_fidelity.py --model pythia-1b --d-sae 24576 --seed 0 --steps all --snapshot-dtype bf16 --hln-dir ${UM_SSD_ROOT}/derived/readout_edit_timing_pythia1b"
      - "uv run python experiments/crosscoders/crosscoder_main/scripts/appendix_validation/readout_functional_fidelity.py --model pythia-6.9b --d-sae 32768 --seed 0 --steps all --snapshot-dtype bf16 --hln-dir ${UM_SSD_ROOT}/derived/readout_edit_timing_pythia69b --ckpt ${UM_SSD_ROOT}/hf_release/parameter-trajectory-crosscoders/pythia-6.9b/W_U/cross-snapshot-32/d32768/seed0-sparse.safetensors"
      - "uv run python experiments/crosscoders/crosscoder_main/scripts/appendix_validation/readout_functional_fidelity_strata.py --model pythia-1b --d-sae 24576 --seed 0 --steps all --snapshot-dtype bf16 --hln-dir ${UM_SSD_ROOT}/derived/readout_edit_timing_pythia1b"

  - id: sparse_feature_causal_tests
    status: active
    description: |
      Sparse-feature readout edits for testing whether learned W_U crosscoder
      features are load-bearing for family-specific output behavior under fixed
      hidden states.
    paper_intent: |
      Appendix H: top-k ablations of sparse readout features on Pythia-1B at step 143k
      across non-Latin scripts, punctuation, digits, and function-word token families.
    scripts_dir: experiments/causal/sparse_feature_causal_tests/scripts/
    figures_dir: figures/sparse_feature_causal_tests/
    results_dir: results/experiments/sparse_feature_causal_tests/
    inputs:
      - ${UM_SSD_ROOT}/hf_release/parameter-trajectory-crosscoders/pythia-1b/W_U/cross-snapshot-32/d24576/seed0.safetensors
      - ${UM_SSD_ROOT}/derived/aggregates/aggregates_pythia-1b_d24576_seed0.pt
    paper_labels:
      - fig:app-sparse-feature-causal-curves
      - fig:app-sparse-feature-causal-specificity-k32
    paper_figures:
      - "paper/figures/sparse_feature_causal_tests/control_corrected_ablation_curves.pdf -> fig:app-sparse-feature-causal-curves"  # family_expansion_summary.csv (top_drop - matched_drop_mean; range over the five matched sets)
      - "paper/figures/sparse_feature_causal_tests/specificity_heatmaps_k32.pdf -> fig:app-sparse-feature-causal-specificity-k32"  # specificity_step<step>_h<step>/control_corrected_drop_k32.csv
    entry:
      - "for c in non_latin_scripts punctuation digits function_words; do uv run python experiments/causal/sparse_feature_causal_tests/scripts/run_1b_pilot.py --concept $c --snapshot-step 1000 --rank-h-step 1000 --eval-h-steps 512 1000 --score-mode positive --out-dir results/experiments/sparse_feature_causal_tests/1b_${c}_step1000_positive; done"
      - "for c in non_latin_scripts punctuation digits function_words; do uv run python experiments/causal/sparse_feature_causal_tests/scripts/run_1b_pilot.py --concept $c --snapshot-step 143000 --rank-h-step 143000 --eval-h-steps 143000 --score-mode positive --out-dir results/experiments/sparse_feature_causal_tests/1b_${c}_step143000_positive; done"
      - "uv run python experiments/causal/sparse_feature_causal_tests/scripts/run_specificity_from_pilots.py --snapshot-step 1000 --h-step 1000"
      - "uv run python experiments/causal/sparse_feature_causal_tests/scripts/run_specificity_from_pilots.py --snapshot-step 143000 --h-step 143000"
      - "uv run python experiments/causal/sparse_feature_causal_tests/scripts/aggregate_causal_tests.py"
    cited_in: [paper/main.tex]

  - id: concept_evolution_validation
    status: active
    description: |
      Token-family / vocabulary-family probe emergence across snapshots. Validates that
      crosscoder features track vocabulary acquisition.
    paper_intent: |
      Section 4.2 (Figure 3) and Appendix F: WordNet supersense probes on W_U rows of
      Pythia-160M and 1B, with matched-random and shuffled-label controls.
    scripts_dir: experiments/probes/concept_evolution_validation/scripts/
    figures_dir: figures/concept_evolution_validation/
    results_dir: results/experiments/probes/concept_evolution_validation/
    inputs:
      - ${UM_SSD_ROOT}/hf_release/parameter-trajectory-crosscoders/pythia-160m/W_U/cross-snapshot-32/d24576/seed0.safetensors
    paper_labels:
      - fig:main-wordnet-matched-controls
      - fig:app-wordnet-supersense-probes-160m-inventory
      - fig:app-wordnet-supersense-probes-1b
      - tab:app-wordnet-supersense-1b
    paper_figures:
      - "paper/figures/vocabulary_family_probes/wordnet_matched_controls_160m.pdf -> fig:main-wordnet-matched-controls"
      - "paper/figures/vocabulary_family_probes/wordnet_supersense_probe_heatmap_160m.png -> fig:app-wordnet-supersense-probes-160m-inventory"
      - "paper/figures/vocabulary_family_probes/wordnet_supersense_probe_heatmap_1b.pdf -> fig:app-wordnet-supersense-probes-1b"
      - "experiments/probes/concept_evolution_validation/derived/wordnet_supersense_1b/wordnet_supersense_probe_pos_summary_1b.csv -> tab:app-wordnet-supersense-1b"
    cited_in:
      - paper/main.tex

  # ─── Validation / Appendix A ────────────────────────────────────────────────
    entry:
      - "uv run python experiments/probes/concept_evolution_validation/scripts/run_wordnet_supersense_probe.py --model pythia-160m"
      - "uv run python experiments/probes/concept_evolution_validation/scripts/run_wordnet_supersense_probe.py --model pythia-1b"
      - "uv run python experiments/probes/concept_evolution_validation/scripts/run_wordnet_matched_controls.py"
      - "uv run python experiments/probes/concept_evolution_validation/scripts/run_wordnet_supersense_probe.py --model pythia-160m --split lemma"  # Appendix F lemma-grouped splits
      - "uv run python experiments/probes/concept_evolution_validation/scripts/run_wordnet_supersense_probe.py --model pythia-1b --split lemma"

  - id: dense_readout_diagnostics
    status: active
    description: |
      Dense spectral and preprocessing diagnostics for W_U snapshots across the
      current paper model set.
    paper_intent: |
      Appendix D: dense-readout diagnostics (mean-direction preprocessing, spectral gap,
      dense reorganization timing in Pythia), which motivate sparse trajectory
      dictionaries over SVD/PCA summaries.
    scripts_dir: experiments/baselines/dense_readout_diagnostics/scripts/
    figures_dir: figures/dense_readout_diagnostics/
    results_dir: results/experiments/dense_readout_diagnostics/
    inputs:
      - ${UM_SSD_ROOT}/snapshots/pythia-160m/EleutherAI_pythia-160m_step*_wu.pt
      - ${UM_SSD_ROOT}/snapshots/pythia-1b/EleutherAI_pythia-1b_step*_wu.pt
      - ${UM_SSD_ROOT}/snapshots/pythia-6.9b/EleutherAI_pythia-6.9b_step*_wu.pt
      - ${UM_SSD_ROOT}/snapshots/OLMo-2-1124-7B/allenai_OLMo-2-1124-7B_step*_wu.pt
    paper_labels:
      - fig:app-dense-reorg-pythia
      - fig:app-mean-direction-preprocessing
      - fig:app-mean-direction-spectral-gap
    paper_figures:
      - "paper/figures/dense_readout/dense_reorganization_timing.pdf -> fig:app-dense-reorg-pythia"
      - "paper/figures/dense_readout/mean_direction_preprocessing.pdf -> fig:app-mean-direction-preprocessing"
      - "paper/figures/dense_readout/mean_direction_spectral_gap_by_model.pdf -> fig:app-mean-direction-spectral-gap"
    cited_in: []

  - id: heldout_checkpoints
    status: active
    description: |
      Held-out checkpoint reconstruction quality (EV vs trained-on snapshots).
      Validates the crosscoder generalizes off the training-snapshot grid.
    paper_intent: |
      Appendix D (held-out checkpoint reconstruction).
    scripts_dir: experiments/ablations/heldout_checkpoints/scripts/
    figures_dir: figures/heldout_checkpoints/
    results_dir: results/experiments/ablations/heldout_checkpoints/
    inputs:
      - ${UM_SSD_ROOT}/hf_release/parameter-trajectory-crosscoders/pythia-160m/W_U/cross-snapshot-32/d8192/seed0.safetensors
      - ${UM_SSD_ROOT}/hf_release/parameter-trajectory-crosscoders/pythia-1b/W_U/cross-snapshot-32/d24576/seed0.safetensors
      - ${UM_SSD_ROOT}/snapshots/pythia-{160m,1b}/  # held-out snapshots not in cross-32 grid
    paper_labels:
      - fig:app-heldout-checkpoints-1b
    paper_figures:
      - "paper/figures/heldout_checkpoints/heldout_reconstruction_1b.pdf -> fig:app-heldout-checkpoints-1b"
    cited_in:
      - paper/main.tex

  - id: olmo_matched_checkpoint_window
    status: active
    description: |
      Pythia-1B W_U late-start checkpoint-window ablation matching the OLMo
      constraint that no sub-step-150 snapshots are available.
    paper_intent: |
      Appendix E: OLMo-2-7B checkpoint-window control for the lifecycle composition.
    scripts_dir: experiments/ablations/olmo_matched_checkpoint_window/scripts/
    figures_dir: figures/olmo_matched_checkpoint_window/
    results_dir: results/experiments/olmo_matched_checkpoint_window/
    inputs:
      - ${UM_SSD_ROOT}/snapshots/pythia-1b/EleutherAI_pythia-1b_step*_wu.pt
      - experiments/crosscoders/crosscoder_main/derived/appendix_validation/large_evals/olmo27b_d32768_seed0.pt
      - figures/feature_lifecycle_trajectories/section52_lifecycle/cache/pythia1b_d24576_decoder_norms.npy
      # OLMo decoder-norm geometry cache read by build_late_start_vs_olmo_figures.py;
      # produced by feature_lifecycle_trajectories' plot_normalized_trajectories.py — run that first.
      - figures/feature_lifecycle_trajectories/section52_lifecycle/cache/olmo2_7b_d32768_decoder_norms.npy
    paper_labels:
      - fig:app-olmo-window-population
    paper_figures:
      - "paper/figures/feature_lifecycle/olmo_matched_checkpoint_window_population_lifecycle_diagnostics.pdf -> fig:app-olmo-window-population"
    cited_in: [paper/main.tex]

  - id: pretraining_recipe_control
    status: active
    description: |
      From-scratch recipe control: matched 31M Pythia-style runs sharing the first
      10B tokens of the Pythia preshuffled Pile in Pythia's order, initialization seed, each changing one
      recipe factor. The paper reports four arms (baseline, warmup_short, wu_lr_0p25,
      wu_lr_4x); a fifth complete arm (warmup_long) is released alongside them.
      Tests whether readout reorganization timing and the availability/expression
      gap track the output-readout (W_U) learning-rate multiplier. Uses a hybrid HF
      GPTNeoXForCausalLM trainer (the Pythia architecture on the modern torch
      stack); a Pythia-style proxy, not a reproduction of the public Pythia run.
    paper_intent: |
      Section 4.5 (Figure 5: readout learning rate shifts readout development) and
      Appendix I. Ships the trainer, the data-slice builders, the W_U geometry analysis,
      the per-condition trajectory crosscoders and their lifecycle statistics over three
      fits, the readout-swap grids, the availability-versus-expression probe, and the
      gauge analysis. The trained checkpoints are on Hugging Face
      (hematteo/readout-recipe-control).
    scripts_dir: experiments/ablations/pretraining_recipe_control/scripts/
    figures_dir: figures/pretraining_recipe_control/
    results_dir: results/experiments/ablations/pretraining_recipe_control/
    inputs:
      - ${UM_SSD_ROOT}/pile_slice/pile_neox20b.bin  # tokenized uint16 Pile slice (or Pythia-preshuffled prefix)
      - ${UM_SSD_ROOT}/runs/{baseline,warmup_short,warmup_long,wu_lr_0p25,wu_lr_4x}/ckpts/step*/model_fp16.pt  # trainer outputs; released at hf.co/hematteo/readout-recipe-control
      - ${UM_SSD_ROOT}/pile_slice/heldout_after10B_2M.bin  # held-out eval slice for the swap / probe / gauge analyses (fetch_heldout_slice.py)
      - results/experiments/ablations/pretraining_recipe_control/crosscoders/cc_<cond>_d8192_seed0.pt  # per-condition trajectory crosscoders (train_control_crosscoder.py)
    paper_labels:
      - fig:app-recipe-control-geometry
      # Lifecycle statistics of the per-condition trajectory crosscoders (analyze_lifecycle.py):
      - fig:main-recipe-dose-response
      - fig:app-recipe-control-trajectories
      - fig:app-recipe-control-reorg
      - tab:app-recipe-control-summary
      # Readout-swap basin, expression-lag probe, gauge analysis:
      - fig:app-recipe-control-basin
      - fig:app-recipe-control-explag
    paper_figures:
      - "paper/figures/recipe_control/F1_geometry_trajectories.pdf -> fig:app-recipe-control-geometry"
      - "paper/figures/recipe_control/timing_dose_response.pdf -> fig:main-recipe-dose-response"  # left: median peak step per fit from lifecycle_multiseed_table.csv (seeds 0-2); right: validation loss from ${UM_SSD_ROOT}/runs/<cond>/metrics.csv (train_control.py)
      - "paper/figures/recipe_control/normalized_trajectories.pdf -> fig:app-recipe-control-trajectories"  # lifecycle_seed0/feature_trajectories.pt (rho, peak steps, seeded display sample)
      - "paper/figures/recipe_control/reorg_window.pdf -> fig:app-recipe-control-reorg"  # lifecycle_seed0/reorg_window.csv
      - "results/experiments/ablations/pretraining_recipe_control/lifecycle_seed0/lifecycle_summary.csv -> tab:app-recipe-control-summary"  # EV / L0 / val loss / profile fractions / median peak / reorganization step per condition (lifecycle_stats.json holds the same, nested)
      - "paper/figures/recipe_control/F2_trajectory_basin.pdf -> fig:app-recipe-control-basin"  # argmin-NLL readout per hidden-state checkpoint from trajectory/trajectory_swap_all.csv
      - "paper/figures/recipe_control/F6_expression_lag.pdf -> fig:app-recipe-control-explag"  # expression_lag/expression_lag.csv
    entry:
      - "uv run python experiments/ablations/pretraining_recipe_control/scripts/fetch_pythia_preshuffled.py --out ${UM_SSD_ROOT}/pile_slice/pythia_preshuffled.bin --target-tokens 10e9"
      - "uv run python experiments/ablations/pretraining_recipe_control/scripts/train_control.py --data ${UM_SSD_ROOT}/pile_slice/pythia_preshuffled.bin --sequential-data --out-dir ${UM_SSD_ROOT}/runs/baseline --model-size 31M --global-batch 1024 --max-tokens 10e9 --readout-lr-mult 1.0 --warmup-steps 1430"  # repeat per condition; see README
      - "uv run python experiments/ablations/pretraining_recipe_control/scripts/analyze_readout_geometry.py --ckpt-root ${UM_SSD_ROOT}/runs --conditions baseline warmup_short wu_lr_0p25 wu_lr_4x --out-csv results/experiments/ablations/pretraining_recipe_control/readout_geometry_pythia.csv"
      - "uv run python experiments/ablations/pretraining_recipe_control/scripts/train_control_crosscoder.py --ckpt-root ${UM_SSD_ROOT}/runs --conditions wu_lr_0p25 baseline wu_lr_4x warmup_short --seed 0 --out-dir results/experiments/ablations/pretraining_recipe_control/crosscoders"
      - "uv run python experiments/ablations/pretraining_recipe_control/scripts/train_control_crosscoder.py --ckpt-root ${UM_SSD_ROOT}/runs --conditions wu_lr_0p25 baseline wu_lr_4x warmup_short --seed 1 --out-dir results/experiments/ablations/pretraining_recipe_control/crosscoders"
      - "uv run python experiments/ablations/pretraining_recipe_control/scripts/train_control_crosscoder.py --ckpt-root ${UM_SSD_ROOT}/runs --conditions wu_lr_0p25 baseline wu_lr_4x warmup_short --seed 2 --out-dir results/experiments/ablations/pretraining_recipe_control/crosscoders"
      - "uv run python experiments/ablations/pretraining_recipe_control/scripts/analyze_lifecycle.py --ckpt-root ${UM_SSD_ROOT}/runs --cc-dir results/experiments/ablations/pretraining_recipe_control/crosscoders --conditions wu_lr_0p25 baseline wu_lr_4x warmup_short --seed 0 --d-sae 8192 --out-dir results/experiments/ablations/pretraining_recipe_control/lifecycle_seed0"
      - "uv run python experiments/ablations/pretraining_recipe_control/scripts/analyze_lifecycle.py --ckpt-root ${UM_SSD_ROOT}/runs --cc-dir results/experiments/ablations/pretraining_recipe_control/crosscoders --conditions wu_lr_0p25 baseline wu_lr_4x warmup_short --seed 1 --d-sae 8192 --out-dir results/experiments/ablations/pretraining_recipe_control/lifecycle_seed1"
      - "uv run python experiments/ablations/pretraining_recipe_control/scripts/analyze_lifecycle.py --ckpt-root ${UM_SSD_ROOT}/runs --cc-dir results/experiments/ablations/pretraining_recipe_control/crosscoders --conditions wu_lr_0p25 baseline wu_lr_4x warmup_short --seed 2 --d-sae 8192 --out-dir results/experiments/ablations/pretraining_recipe_control/lifecycle_seed2"
      - "uv run python experiments/ablations/pretraining_recipe_control/scripts/aggregate_seed_replication.py --seed-stat results/experiments/ablations/pretraining_recipe_control/lifecycle_seed0/lifecycle_stats.json --seed-stat results/experiments/ablations/pretraining_recipe_control/lifecycle_seed1/lifecycle_stats.json --seed-stat results/experiments/ablations/pretraining_recipe_control/lifecycle_seed2/lifecycle_stats.json --seeds 0 1 2 --out-json results/experiments/ablations/pretraining_recipe_control/lifecycle_multiseed_summary.json --out-csv results/experiments/ablations/pretraining_recipe_control/lifecycle_multiseed_table.csv"
      - "uv run python experiments/ablations/pretraining_recipe_control/scripts/fetch_heldout_slice.py --out ${UM_SSD_ROOT}/pile_slice/heldout_after10B_2M.bin --start-token 10e9 --eval-tokens 2e6"
