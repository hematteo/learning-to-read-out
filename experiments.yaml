      - "paper/figures/vocabulary_family_probes/wordnet_matched_controls_160m.pdf -> fig:main-wordnet-matched-controls"
      - "paper/figures/vocabulary_family_probes/wordnet_supersense_probe_heatmap_1b.pdf -> fig:app-wordnet-supersense-probes-1b"
      - "experiments/probes/concept_evolution_validation/derived/wordnet_supersense_1b/wordnet_supersense_probe_pos_summary_1b.csv -> tab:app-wordnet-supersense-1b"
      - "paper/figures/vocabulary_family_probes/wordnet_matched_controls_160m.pdf -> fig:lr-wordnet"
    cited_in:
      - paper/main.tex

  # ─── Validation / Appendix A ────────────────────────────────────────────────

