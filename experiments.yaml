# Machine-readable experiment manifest. Single source of truth for:
#   - which experiment dir produces which paper figure
#   - canonical input/output paths
#   - the thesis-figure labels each experiment's metrics back
#
# Maintained / checked by:
#   uv run python scripts/audit/check_layout.py    # validates schema + paper-label coverage
#
# Schema (per entry):
#   id:               str   matches experiments/<topic>/<id>/ and figures/<id>/; results_dir is
#                     usually results/experiments/<topic>/<id>/, but four entries drop the
#                     <topic> segment to match their scripts' historical defaults
#   status:           one of {active, draft, superseded, archived}
#   description:      one sentence — what this experiment investigates
#   paper_intent:     what part of the paper claim this supports (semantic, not section number;
#                     "Section 5.x" tags are descriptive only, sections may renumber)
#   scripts_dir:      where the runnable code lives; always the experiment's
#                     scripts/ dir (experiments/<topic>/<id>/scripts/, audit-enforced)
#   figures_dir:      where figure outputs are written
#   results_dir:      where numerical outputs are written (gitignored)
#   NB: when an experiment runs, its metrics land under experiments/<topic>/<id>/derived/
#       (gitignored, NOT shipped); results_dir is the external-SSD recomputation path.
#   inputs:           canonical input paths (usually SSD)
#   paper_labels:     list of \label{fig:...} or \label{tab:...} strings this experiment produces
#   paper_figures:    list of "<path-relative-to-paper/main.tex \graphicspath> -> <label>" mappings
#   entry:            primary CLI command(s) in execution order (optional)
#   cited_in:         which prose files reference these figures
#
# ─── CODE-ONLY RELEASE ───────────────────────────────────────────────────────
# This repository ships code only — no data and no metrics. Each experiment
# computes and PERSISTS the metrics behind its figures (CSV/JSON/.pt) when run —
# those regenerated files are the reproducible artifacts (gitignored, not
# shipped) — and ships NO figure-rendering code. The `paper_labels:` and
# `paper_figures:` fields below are documentational: they map each experiment's
# metrics to the thesis figures they back, which are rendered in the separate
# thesis LaTeX tree, not in this repo.

# Top-level paper_only_labels are labels owned by the paper itself, not produced
# by an experiment pipeline.
paper_only_labels:
  - fig:lr-method-schematic
  # Hand-authored thesis tables (typeset in the LaTeX tree, no experiment pipeline produces them):
  - tab:lr-model-roles            # App A: model/role inventory
  - tab:checkpoint-suite-comparison  # App A: public checkpoint-suite survey
  - tab:repro-compute             # App A: compute envelope
  - tab:lr-validation             # Ch4: main-text validation summary
  - tab:lr-localization-ledger    # Ch4: main-text localisation ledger
  - tab:lifecycle-profile-rules   # App C: rule-based lifecycle-profile definitions

# Naming principle: experiment ids describe the experiment object, not its paper position.
#   GOOD: feature_lifecycle_trajectories, temporal_localization_patching
#   BAD : section52, sec_5_3, fig1_experiment

experiments:

  # ─── Core paper claims (Results) ────────────────────────────────────────────

  - id: crosscoder_main
    status: active
    description: |
      Multiscale main analysis (160M / 1B / 6.9B parameter-trajectory crosscoders).
      Umbrella experiment for the shared multiscale analyses. The lifecycle,
      temporal-localization, EV/L0-pareto, and per-snapshot baseline analyses each
      live in their own claim-anchored experiment; this entry holds the rest.
    paper_intent: |
      Sections 5.1 (multimodel validation), 5.2 (sparse lifecycle), 5.3 (temporal localization
      near step 1k), 5.4 (vocabulary family emergence), and Appendix A (instrument validation).
    scripts_dir: experiments/crosscoders/crosscoder_main/scripts/
    figures_dir: figures/crosscoder_main/
    results_dir: results/experiments/crosscoders/crosscoder_main/
    inputs:
      - ${UM_SSD_ROOT}/hf_release/parameter-trajectory-crosscoders/pythia-160m/W_U/cross-snapshot-32/d24576/seed0.safetensors
      - ${UM_SSD_ROOT}/hf_release/parameter-trajectory-crosscoders/pythia-1b/W_U/cross-snapshot-32/d24576/seed0.safetensors
      - ${UM_SSD_ROOT}/hf_release/parameter-trajectory-crosscoders/pythia-6.9b/W_U/cross-snapshot-32/d32768/seed0-sparse.safetensors
      - ${UM_SSD_ROOT}/hf_release/parameter-trajectory-crosscoders/pythia-6.9b/W_U/cross-snapshot-32/d32768/seed0.safetensors  # denser/default-lambda comparison only
      - ${UM_SSD_ROOT}/snapshots/pythia-1b/EleutherAI_pythia-1b_step*_wu.pt
      - ${UM_SSD_ROOT}/derived/aggregates/aggregates_pythia-*_d*_seed*.pt
    paper_labels:
      # NB: labels for the split-out lifecycle / temporal / pareto / persnap experiments
      # now live on those experiments (feature_lifecycle_trajectories,
      # temporal_localization_patching, pareto_frontier_ev_l0, persnap_sae_baseline).
      - fig:main-multimodel-validation
      - fig:app-fidelity-curves
      - fig:app-pca-static
      - fig:app-concat-pca
      - fig:app-endpoint-linear
      - fig:app-norm-pareto
      - fig:app-norm-pareto-raw-vs-pct
      - fig:app-large-selected-persnap
      - fig:app-p69b-dense-vs-sparse
      - fig:app-large-l0-token-distribution
      - fig:app-large-feature-rate-distribution
      - fig:app-selected-normalized-trajectories
      - tab:repro-hparams
      - tab:full-inventory
      - fig:lr-validation
    paper_figures:
      - "paper/figures/multimodel_validation/instrument_validation_summary.pdf -> fig:main-multimodel-validation"
      - "paper/figures/readout_functional_fidelity/fidelity_curves.pdf -> fig:app-fidelity-curves"
      - "paper/figures/dense_baselines/static_pca_baseline.pdf -> fig:app-pca-static"
      - "paper/figures/dense_baselines/concatenated_trajectory_pca.pdf -> fig:app-concat-pca"
      - "paper/figures/dense_baselines/endpoint_line_baseline.pdf -> fig:app-endpoint-linear"
      - "paper/figures/normalized_sparsity/normalized_sparsity_pareto.pdf -> fig:app-norm-pareto"
      - "paper/figures/normalized_sparsity/raw_vs_normalized_sparsity_pareto.pdf -> fig:app-norm-pareto-raw-vs-pct"
      - "paper/figures/large_model/selected_large_model_checkpoint_diagnostics.pdf -> fig:app-large-selected-persnap"
      - "paper/figures/large_model/pythia69b_sparse_vs_dense.pdf -> fig:app-p69b-dense-vs-sparse"
      - "paper/figures/large_model/token_active_feature_distribution.pdf -> fig:app-large-l0-token-distribution"
      - "paper/figures/large_model/feature_activation_rate_distribution.pdf -> fig:app-large-feature-rate-distribution"
      - "experiments/crosscoders/crosscoder_main/derived/appendix_validation/full_inventory.csv -> tab:full-inventory"
      - "paper/figures/multimodel_validation/instrument_validation_summary.pdf -> fig:lr-validation"
    cited_in:
      - paper/main.tex

  - id: sparse_feature_causal_tests
    status: active
    description: |
      Sparse-feature readout edits for testing whether learned W_U crosscoder
      features are load-bearing for family-specific output behavior under fixed
      hidden states.
    paper_intent: |
      Main-text and appendix causal audit: Ge-style top-k ablations of sparse
      readout features on Pythia-1B, evaluated at mature step 143k across
      non-Latin scripts, punctuation, digits, and function-word token families.
    scripts_dir: experiments/causal/sparse_feature_causal_tests/scripts/
    figures_dir: figures/sparse_feature_causal_tests/
    results_dir: results/experiments/sparse_feature_causal_tests/
    inputs:
      - ${UM_SSD_ROOT}/hf_release/parameter-trajectory-crosscoders/pythia-1b/W_U/cross-snapshot-32/d24576/seed0.safetensors
      - ${UM_SSD_ROOT}/derived/aggregates/aggregates_pythia-1b_d24576_seed0.pt
      - results/experiments/sparse_feature_causal_tests/specificity_step143000_h143000/manifest.json
    paper_labels:
      - fig:main-sparse-feature-causal-summary
      - fig:app-sparse-feature-causal-curves
      - fig:app-sparse-feature-causal-specificity-k16
      - fig:app-sparse-feature-causal-specificity-k32
      - fig:lr-localization
    paper_figures:
      - "paper/figures/sparse_feature_causal_tests/sparse_feature_causal_summary.pdf -> fig:main-sparse-feature-causal-summary"
      - "paper/figures/sparse_feature_causal_tests/control_corrected_ablation_curves.pdf -> fig:app-sparse-feature-causal-curves"
      - "paper/figures/sparse_feature_causal_tests/specificity_heatmaps_k16.pdf -> fig:app-sparse-feature-causal-specificity-k16"
      - "paper/figures/sparse_feature_causal_tests/specificity_heatmaps_k32.pdf -> fig:app-sparse-feature-causal-specificity-k32"
      - "paper/figures/sparse_feature_causal_tests/contrastive_task_localization_1x3.pdf -> fig:lr-localization"
    entry:
      - uv run python experiments/causal/sparse_feature_causal_tests/scripts/run_1b_pilot.py
      - uv run python experiments/causal/sparse_feature_causal_tests/scripts/run_specificity_from_pilots.py --snapshot-step 1000 --h-step 1000
    cited_in: []

  - id: concept_evolution_validation
    status: active
    description: |
      Token-family / vocabulary-family probe emergence across snapshots. Validates that
      crosscoder features track vocabulary acquisition.
    paper_intent: |
      Pythia-160M WordNet lexicographer-file probe timing audit for
      vocabulary-family availability in W_U. The paper treats this as
      corroborating timing evidence, not a fully controlled semantic-probe study.
    scripts_dir: experiments/probes/concept_evolution_validation/scripts/
    figures_dir: figures/concept_evolution_validation/
    results_dir: results/experiments/probes/concept_evolution_validation/
    inputs:
      - ${UM_SSD_ROOT}/hf_release/parameter-trajectory-crosscoders/pythia-160m/W_U/cross-snapshot-32/d24576/seed0.safetensors
    paper_labels:
      - fig:app-wordnet-supersense-probes-160m-inventory
      - fig:main-wordnet-matched-controls
      - fig:app-wordnet-supersense-probes-1b
      - tab:app-wordnet-supersense-1b
      - fig:lr-wordnet
    paper_figures:
