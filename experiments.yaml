      - experiments/crosscoders/crosscoder_main/derived/appendix_validation/large_evals/olmo27b_d32768_seed0.pt
    paper_labels:
      - fig:app-olmo-window-metric-grid
      - fig:app-olmo-window-population
    paper_figures:
      - "paper/figures/feature_lifecycle/olmo_matched_checkpoint_window_metric_grid.pdf -> fig:app-olmo-window-metric-grid"
      - "paper/figures/feature_lifecycle/olmo_matched_checkpoint_window_population_lifecycle_diagnostics.pdf -> fig:app-olmo-window-population"
    cited_in: [paper/main.tex]

  - id: pretraining_recipe_control
    status: active
    description: |
      From-scratch pretraining sensitivity check: four matched 31M Pythia-style
      runs (baseline, long_warmup, wu_lr_0p25, wu_lr_4x) sharing one tokenized
      slice, seed, and data order, each perturbing one optimizer-recipe axis.
      Tests whether readout-feature timing and the availability-expression lag
      are stable under, or sensitive to, plausible recipe perturbations —
      especially the output-readout (W_U) learning-rate multiplier. Uses a hybrid
      HF GPTNeoXForCausalLM trainer (the Pythia architecture on the modern torch
      stack); a Pythia-style proxy, not a reproduction of the public Pythia run.
    paper_intent: |
      Sensitivity/falsification control for the Chapter 4 learning-to-read-out
      claim. Not cited in the paper; produces W_U readout geometry across
      conditions x token-milestone checkpoints (downstream lag-probe analysis
      pending).
    scripts_dir: experiments/ablations/pretraining_recipe_control/scripts/
    figures_dir: figures/pretraining_recipe_control/
    results_dir: results/experiments/ablations/pretraining_recipe_control/
    inputs:
      - ${UM_SSD_ROOT}/pile_slice/pile_neox20b.bin  # tokenized uint16 Pile slice (or Pythia-preshuffled prefix)
      - ${UM_SSD_ROOT}/runs/{baseline,long_warmup,wu_lr_0p25,wu_lr_4x}/ckpts/step*/model_fp16.pt  # trainer outputs (analysis input)
    paper_labels:
