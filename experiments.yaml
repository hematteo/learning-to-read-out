  - id: contrastive_readout_swap
    status: active
    description: |
      Contrastive (y+/y-) readout-swap heatmaps: for single-token two-choice tasks
      (SVA, induction, IOI, numeric_gt, relational_facts, hypernym), score
      margin(t, s) = h_t · W_U^s[y+] - h_t · W_U^s[y-] over all (h_step, s_step)
      pairs and report delta_margin / delta_accuracy vs the native (t, t) cell.
      Tests whether early hidden states already contain task-relevant signal that
      a same-checkpoint readout has not yet expressed.
    paper_intent: |
      Capability-level readout-validation appendix; supports stronger
      "task-relevant signals" framing if multiple families show positive,
      gauge-aligned, temporally-localized rescue.
