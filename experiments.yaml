    description: |
      Dense spectral and preprocessing diagnostics for W_U snapshots across the
      current paper model set.
    paper_intent: |
      Appendix dense-readout validation: shows centered W_U remains high-dimensional
      across Pythia and OLMo, and motivates sparse trajectory dictionaries over
      simple SVD/PCA summaries.
    scripts_dir: experiments/baselines/dense_readout_diagnostics/scripts/
    figures_dir: figures/dense_readout_diagnostics/
    results_dir: results/experiments/dense_readout_diagnostics/
    inputs:
      - ${UM_SSD_ROOT}/snapshots/pythia-160m/EleutherAI_pythia-160m_step*_wu.pt
      - ${UM_SSD_ROOT}/snapshots/pythia-1b/EleutherAI_pythia-1b_step*_wu.pt
      - ${UM_SSD_ROOT}/snapshots/pythia-6.9b/EleutherAI_pythia-6.9b_step*_wu.pt
      - ${UM_SSD_ROOT}/snapshots/OLMo-2-1124-7B/allenai_OLMo-2-1124-7B_step*_wu.pt
    paper_labels:
      - fig:app-spectral-capacity
      - fig:app-dense-reorg-pythia
      - fig:app-dense-reorg-olmo
      - fig:app-mean-direction-preprocessing
      - fig:app-mean-direction-spectral-gap
    paper_figures:
      - "paper/figures/dense_readout/spectral_capacity_multimodel.pdf -> fig:app-spectral-capacity"
      - "paper/figures/dense_readout/dense_reorganization_timing.pdf -> fig:app-dense-reorg-pythia"
      - "paper/figures/dense_readout/dense_reorganization_timing_olmo.pdf -> fig:app-dense-reorg-olmo"
      - "paper/figures/dense_readout/mean_direction_preprocessing.pdf -> fig:app-mean-direction-preprocessing"
      - "paper/figures/dense_readout/mean_direction_spectral_gap_by_model.pdf -> fig:app-mean-direction-spectral-gap"
    cited_in: []

  - id: heldout_checkpoints
    status: active
    description: |
      Held-out checkpoint reconstruction quality (EV vs trained-on snapshots).
      Validates the crosscoder generalizes off the training-snapshot grid.
    paper_intent: |
      Appendix A.4 (Held-out Checkpoint Reconstruction).
    scripts_dir: experiments/ablations/heldout_checkpoints/scripts/
    figures_dir: figures/heldout_checkpoints/
    results_dir: results/experiments/ablations/heldout_checkpoints/
    inputs:
      - ${UM_SSD_ROOT}/hf_release/parameter-trajectory-crosscoders/pythia-160m/W_U/cross-snapshot-32/d8192/seed0.safetensors
      - ${UM_SSD_ROOT}/hf_release/parameter-trajectory-crosscoders/pythia-1b/W_U/cross-snapshot-32/d24576/seed0.safetensors
