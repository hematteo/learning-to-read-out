  - id: olmo_matched_checkpoint_window
    status: active
    description: |
      Pythia-1B W_U late-start checkpoint-window ablation matching the OLMo
      constraint that no sub-step-150 snapshots are available.
    paper_intent: Appendix scope check for the OLMo PCA lifecycle geometry.
    scripts_dir: experiments/ablations/olmo_matched_checkpoint_window/scripts/
    figures_dir: figures/olmo_matched_checkpoint_window/
    results_dir: results/experiments/olmo_matched_checkpoint_window/
    inputs:
