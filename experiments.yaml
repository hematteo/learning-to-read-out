      - "paper/figures/read_write/we_procrustes_alignment.pdf -> fig:app-we-procrustes"
    cited_in:
      - "Appendix \\cref{sec:app-we-crosscoders}"

  - id: crosscoder_olmo
    status: active
    description: |
      Cross-family OLMo validation metrics and lifecycle/timing context for the
      selected paper-facing OLMo W_U crosscoder sidecars.
    paper_intent: |
      Cross-family validation point in the main instrument table, lifecycle
      panels, and timing appendix. OLMo is treated as cross-family context rather
