      # readout_geometry_pythia.csv). The other App-CC recipe-control figures and
      # tab:app-recipe-control-summary are thesis-tree-only — see docs/REPRODUCE.md.
      - fig:app-recipe-control-geometry
    paper_figures:
      - "figures/pretraining_recipe_control/readout_geometry_trajectories.pdf -> fig:app-recipe-control-geometry"
    cited_in: []

  # ─── Companion / Replication ────────────────────────────────────────────────

  - id: crosscoder_we
    status: active
    description: |
      W_E (input embedding) variant of the crosscoder; companion to the W_U (output) crosscoder.
      Multi-seed pilot establishing W_E vs W_U asymmetry.
    paper_intent: |
      Lead-lag analysis (W_E vs W_U); referenced in Discussion / read-write asymmetry.
    scripts_dir: experiments/crosscoders/crosscoder_we/scripts/
    figures_dir: figures/crosscoder_we/
    results_dir: results/experiments/crosscoder_we/
    inputs:
      - ${UM_SSD_ROOT}/hf_release/parameter-trajectory-crosscoders/pythia-*/W_E/cross-snapshot-32/d*/seed*.safetensors
      - ${UM_SSD_ROOT}/derived/rates/we-d24576/we_rates_dsae24576_seed0.pt
    paper_labels:
